name: Fix vulnerable dependencies

# Renovate updates direct dependencies. Other crates in the lockfile change only to fix a known vulnerability.
on:
  schedule:
    - cron: "00 17 * * *" # Every day at 17:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  fix-vulnerabilities:
    name: Fix vulnerable dependencies
    runs-on: ubuntu-26.04
    env:
      # renovate: datasource=crate depName=cargo-audit
      CARGO_AUDIT_VERSION: "0.22.2"
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Generate Auto-Merge GitHub App Token
        id: generate-automerge-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Install cargo-audit
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-audit@${{ env.CARGO_AUDIT_VERSION }}

      - name: Update vulnerable crates
        id: update
        run: |
          ./scripts/cargo-audit-fix.sh 2> >(tee /dev/stderr) | ./scripts/cargo-update-filter.sh > /tmp/cargo-update.log
          echo "log=$(jq -Rs . < /tmp/cargo-update.log)" >> ${GITHUB_OUTPUT}
          echo "table=$(./scripts/cargo-update-to-table.sh < /tmp/cargo-update.log | jq -Rs .)" >> ${GITHUB_OUTPUT}
          if cargo audit; then
            echo "resolved=true" >> ${GITHUB_OUTPUT}
          else
            echo "resolved=false" >> ${GITHUB_OUTPUT}
          fi

      - name: Create pull request
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: |
            build(deps): fix vulnerable dependencies

            ${{ fromJSON(steps.update.outputs.log) }}
          branch: security-update
          title: "build(deps): fix vulnerable dependencies"
          body: |
            Updates crates with known vulnerabilities to the latest versions per Cargo.toml constraints.

            ${{ fromJSON(steps.update.outputs.table) }}
          author: "missionis[bot] <234988995+missionis[bot]@users.noreply.github.com>"
          committer: "missionis[bot] <234988995+missionis[bot]@users.noreply.github.com>"
          labels: |
            dependencies
            rust
            security
          delete-branch: true

      - name: Enable auto-merge
        id: enable-auto-merge
        if: steps.create-pr.outputs.pull-request-number
        run: |
          gh pr merge --auto -ds ${{ steps.create-pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ steps.generate-automerge-token.outputs.token }}

      # A fix that needs an incompatible version cannot be applied automatically
      - name: Fail on remaining vulnerabilities
        if: steps.update.outputs.resolved == 'false'
        run: |
          echo "::error::vulnerabilities remain after the update"
          exit 1
