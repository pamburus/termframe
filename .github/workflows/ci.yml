name: ci

on:
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main, release/**]

permissions:
  contents: read
  pull-requests: write
  actions: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  test:
    # Platform names keep required check names stable when runner versions change
    name: test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: macos
            os: macos-26
          - platform: windows
            os: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Setup taplo
        uses: uncenter/setup-taplo@b18c8c8302695fe63d6853bc004006215ac52b91 # v2

      - name: Setup tombi
        uses: tombi-toml/setup-tombi@be97456589cb1f9c6c8a419bd7fe825b40a9df50 # v1.8.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate TOML configs and themes with taplo
        run: taplo check

      - name: Validate TOML configs and themes with tombi
        run: tombi lint

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features

      - name: Install latest nightly
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
          components: rustfmt

      - name: Check formatting
        run: cargo +nightly fmt --verbose --all --check

      - name: markdownlint-cli2-action
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

      - name: Build
        run: cargo build --locked --verbose --benches --workspace

      - name: Run tests
        run: cargo test --locked --verbose --workspace

      - name: Run executable
        run: cargo run --locked

  # Builds the release targets that use cross, the way the release workflow does
  cross-build:
    name: cross-build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl

    env:
      # renovate: datasource=crate depName=cross
      CROSS_VERSION: "0.2.5"
      CARGO_TERM_COLOR: never

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cross@${{ env.CROSS_VERSION }}

      - name: Point schema references to the current version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "termframe") | .version')
          build/ci/update-schema-refs.sh "${{ github.repository }}" "${VERSION:?}"

      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }} 2>&1 | tee build.log

      # Build script warnings do not fail the build, but they show up in release builds
      - name: Check for warnings
        run: |
          if grep -E '^warning' build.log; then
            echo "::error::build produced warnings"
            exit 1
          fi

      # Release binaries for glibc targets must run on older distributions
      - name: Check required glibc version
        if: endsWith(matrix.target, '-linux-gnu')
        env:
          MAX_GLIBC: "2.23"
        run: |
          REQUIRED=$(readelf -V --wide target/${{ matrix.target }}/release/termframe | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "requires glibc ${REQUIRED:?}, allowed up to ${MAX_GLIBC:?}"
          if [ "$(printf '%s\n' "${REQUIRED}" "${MAX_GLIBC}" | sort -V | tail -1)" != "${MAX_GLIBC}" ]; then
            echo "::error::binary requires glibc ${REQUIRED}, newer than ${MAX_GLIBC}"
            exit 1
          fi

  coverage:
    runs-on: ubuntu-24.04

    env:
      # renovate: datasource=crate depName=rustfilt
      RUSTFILT_VERSION: "0.2.1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install latest toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install coverage tools
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: rustfilt@${{ env.RUSTFILT_VERSION }}

      - name: Generate code coverage
        run: |
          bash -x contrib/bin/setup.sh coverage
          bash -x build/ci/coverage.sh

      - name: Upload coverage to codecov.io
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true

  test-nix:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3

      - name: Cache Nix store
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: termframe
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run nix flake check
        run: nix flake check --print-build-logs --all-systems --no-update-lock-file

      - name: Run nix build
        run: nix build --print-build-logs --no-update-lock-file
